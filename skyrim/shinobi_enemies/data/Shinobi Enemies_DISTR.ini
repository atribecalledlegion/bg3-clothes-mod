; Shinobi Enemies - Phase 1: bandits (SPID 7)
; Format: Type = Form|StringFilters|FormFilters  ("," = OR, "+" = AND, "-" = NOT)
; 0x1BCC0~Skyrim.esm = BanditFaction. Roles come from the vanilla combat style (or class) the bandit was given.
; SNE_BanditBrain reads these keywords; if SPID cannot see a templated NPC's style, the script works the role out itself.

; every bandit: the tactics brain + the base keyword
Spell = 0x80C~Shinobi Enemies.esp|NONE|0x1BCC0~Skyrim.esm
; glass-cannon perk: every bandit has it, but its entries only work while the script's mage mark is on
; (SPID's style filter missed a csHumanMagic bandit in the first test, so mage-only things go through the script)
Perk = 0x813~Shinobi Enemies.esp|NONE|0x1BCC0~Skyrim.esm
Keyword = SNE_Bandit|NONE|0x1BCC0~Skyrim.esm

; chief: csHumanBoss1H, csHumanBoss2H, Dragonborn DLC2EncClassBanditBoss
Keyword = SNE_BanditChief|NONE|0x1BCC0~Skyrim.esm+0x3DECE~Skyrim.esm,0x1BCC0~Skyrim.esm+0x3DECF~Skyrim.esm,0x1BCC0~Skyrim.esm+0x1E8AC~Dragonborn.esm

; mage: csHumanMagic, csForswornBossMagic, csWarlock, EncClassBanditWizard
Keyword = SNE_BanditMage|-SNE_BanditChief|0x1BCC0~Skyrim.esm+0x3BE1C~Skyrim.esm,0x1BCC0~Skyrim.esm+0x442D1~Skyrim.esm,0x1BCC0~Skyrim.esm+0x44CD0~Skyrim.esm,0x1BCC0~Skyrim.esm+0x39D30~Skyrim.esm

; archer: csHumanMissile, EncClassBanditMissile
Keyword = SNE_BanditArcher|-SNE_BanditChief,-SNE_BanditMage|0x1BCC0~Skyrim.esm+0x3BE1D~Skyrim.esm,0x1BCC0~Skyrim.esm+0x15BE7~Skyrim.esm

; tank: csHumanTankLvl1
Keyword = SNE_BanditTank|-SNE_BanditChief,-SNE_BanditMage,-SNE_BanditArcher|0x1BCC0~Skyrim.esm+0x3CF5A~Skyrim.esm

; thug: every other bandit
Keyword = SNE_BanditThug|-SNE_BanditChief,-SNE_BanditMage,-SNE_BanditArcher,-SNE_BanditTank|0x1BCC0~Skyrim.esm

; ---------- vampires (2026-10-15) ----------
; VampireFaction 0x27242 + VampireThrallFaction 0x2EB13: the vampire brain (roles, selfish elders, feeding,
; necromancy, lair reinforcements). Followers and non-hostile vampires are skipped by the script.
Spell = 0x81B~Shinobi Enemies.esp|NONE|0x27242~Skyrim.esm,0x2EB13~Skyrim.esm

; ---------- draugr (2026-10-15) ----------
; DraugrFaction 0x2430D: the draugr brain (relentless commons, barrow lords, return to the grave, life force,
; Edo Tensei revival for lords). Dragon Priests only receive life force (SNE_DraugrQuest), no brain.
Spell = 0x829~Shinobi Enemies.esp|NONE|0x2430D~Skyrim.esm
; SNE_DraugrPerk: draugr attacks x1.3 (they hit harder than bandits; slow and readable, so it is fair)
Perk = 0x881~Shinobi Enemies.esp|NONE|0x2430D~Skyrim.esm

; ---------- warlocks (2026-10-15) ----------
