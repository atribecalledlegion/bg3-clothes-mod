; raising/binding/phylactery, conjurer reverse summoning, storm armour, frost mirrors, fire ash burning).
Spell = 0x871~Shinobi Enemies.esp|NONE|0x26724~Skyrim.esm,0x34B74~Skyrim.esm

; ---------- Falmer (2026-10-15) ----------
